# Builds the static site and uploads ./out to BigRock cPanel hosting (public_html) over FTP
# on every push to main. Set the three FTP secrets in GitHub: Settings > Secrets and variables > Actions.
name: Deploy to BigRock

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bigrock
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload out/ to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          # Folder relative to the FTP account's root. Override with an FTP_DIR secret if needed.
          server-dir: ${{ secrets.FTP_DIR || 'public_html/' }}
